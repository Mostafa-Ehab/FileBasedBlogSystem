<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Blog</title>
    <meta property="og:title" content="Verify Email - Blog">
    <meta property="og:url" content="/blog/verify-email.html">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Verify your email address to activate your account.">
    <meta property="og:image" content="/assets/images/blog-thumbnail.png">

    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="/assets/js/blog/shared/navbar.js" defer></script>
    <script src="/assets/js/blog/shared/search.js" defer></script>
    <script src="/assets/js/blog/verify-email.js" defer></script>

    <script src="/assets/js/shared/api.js" defer></script>
    <script src="/assets/js/shared/auth.js" defer></script>
    <script src="/assets/js/shared/errors.js" defer></script>
    <script src="/assets/js/shared/utils.js" defer></script>
</head>

<body>
    <nav class="navbar">
        <!-- Add navbar content if needed -->
    </nav>
    <main class="content">
        <section class="login-section">
            <h2 class="login-title">
                <i class="fa-solid fa-envelope"></i> Verify Email
            </h2>
            <p>Please enter the verification code sent to your email
            <form class="login-form" id="verify-form" method="post" action="/blog/verify-email">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required
                            autocomplete="email" disabled>
                    </div>
                </div>

                <div class="form-group">
                    <label for="code">Verification Code</label>
                    <div class="input-group">
                        <i class="fas fa-key"></i>
                        <input type="text" id="code" name="code" placeholder="Enter your verification code" required
                            autocomplete="off" maxlength="8" autofocus>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="verify-btn">
                    <span class="btn-text">Verify Email</span>
                    <i class="fas fa-spinner fa-spin" id="verify-spinner" style="display: none;"></i>
                </button>

                <div class="login-footer">
                    Already verified? <a href="/blog/login.html" class="register-link">Sign in here</a>
                </div>
            </form>
        </section>

        <!-- Error Message -->
        <div class="error-message" id="error-message" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="error-text"></span>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="success-message" style="display: none;">
            <i class="fas fa-check-circle"></i>
            <span id="success-text"></span>
        </div>
    </main>
    <footer class="footer">
        <p>&copy; 2025 Blog. All rights reserved.</p>
    </footer>
</body>

</html>
